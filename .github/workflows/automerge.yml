name: Arm auto-merge

# A green pull request must enqueue itself. Arming auto-merge by hand is a step
# a human forgets: on 2026-08-17 PRs #103, #104 and #105 were green at 05:23:51Z,
# 05:36:31Z and 06:00:41Z and none carried autoMergeRequest, so all three sat
# until a human batch-enqueued them at 06:05:47Z -- 41m56s, 29m18s and 5m06s of
# idle green.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: arm-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  arm:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_ID: ${{ github.event.pull_request.node_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          OWNER: ${{ github.event.repository.owner.login }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -uo pipefail

          # Arming a branch that gates nothing is worse than not arming it: with
          # no required check, auto-merge degrades into an immediate merge, which
          # is how a red pull request landed on main and cost a 2h33m recovery.
          # Required checks live in two independent places -- classic branch
          # protection and rulesets -- and neither view shows the other, so count
          # both. Failing to read them is treated as "no gate": an unarmed PR is
          # a delay, an armed one with no gate is a red merge.
          # The branch endpoint, not .../protection: GITHUB_TOKEN has push access
          # but not admin, and the protection endpoint requires admin.
          classic=$(gh api "repos/$OWNER/$REPO/branches/$BASE_REF" \
            --jq '[(.protection.required_status_checks.contexts // [])[],
                   ((.protection.required_status_checks.checks // [])[] | .context)] | unique | length' 2>/dev/null) || classic=0
          ruleset=$(gh api "repos/$OWNER/$REPO/rules/branches/$BASE_REF" \
            --jq '[.[] | select(.type == "required_status_checks")
                       | .parameters.required_status_checks[]? | .context] | unique | length' 2>/dev/null) || ruleset=0
          [ -n "$classic" ] || classic=0
          [ -n "$ruleset" ] || ruleset=0
          if [ "$((classic + ruleset))" -eq 0 ]; then
            echo "refusing to arm #$PR_NUMBER: $BASE_REF has no required status check," >&2
            echo "so auto-merge would degrade into an immediate merge." >&2
            exit 1
          fi
          echo "$BASE_REF gates on $classic classic + $ruleset ruleset required check(s)"

          # The arming call is strategy-sensitive in BOTH directions, and both
          # failures are silent no-ops that leave a green PR sitting:
          #   * a merge queue owns the strategy, so naming one is rejected with
          #     "The merge strategy for <branch> is set by the merge queue";
          #   * with no queue the mutation defaults to MERGE, which a
          #     squash-only repository rejects with "Merge method merge commits
          #     are not allowed on this repository" (measured 2026-08-17 06:14Z).
          # So ask the repository which case it is instead of guessing.
          queue=$(gh api graphql -f query='
            query($owner: String!, $repo: String!, $base: String!) {
              repository(owner: $owner, name: $repo) {
                mergeQueue(branch: $base) { id }
              }
            }' -f owner="$OWNER" -f repo="$REPO" -f base="$BASE_REF" \
            --jq '.data.repository.mergeQueue.id // ""' 2>/dev/null) || queue=""

          arm() {
            if [ -n "$1" ]; then
              gh api graphql -f query='
                mutation($id: ID!) {
                  enablePullRequestAutoMerge(input: {pullRequestId: $id, mergeMethod: SQUASH}) {
                    pullRequest { number autoMergeRequest { enabledAt } }
                  }
                }' -f id="$PR_ID" 2>&1
            else
              gh api graphql -f query='
                mutation($id: ID!) {
                  enablePullRequestAutoMerge(input: {pullRequestId: $id}) {
                    pullRequest { number autoMergeRequest { enabledAt } }
                  }
                }' -f id="$PR_ID" 2>&1
            fi
          }

          # Queue present -> let the queue name the strategy. No queue -> name it.
          if [ -n "$queue" ]; then first=""; second="squash"; else first="squash"; second=""; fi

          settled() {
            grep -q '"enabledAt"' <<<"$1" && return 0
            grep -qi 'already enabled\|is in clean status' <<<"$1"
          }

          response=$(arm "$first")
          printf '%s\n' "$response"
          if settled "$response"; then
            echo "auto-merge armed for #$PR_NUMBER"
            exit 0
          fi

          # The repository disagreed about who owns the strategy; take the
          # other branch of the same decision rather than leaving it unarmed.
          echo "retrying with the other merge-strategy form" >&2
          response=$(arm "$second")
          printf '%s\n' "$response"
          if settled "$response"; then
            echo "auto-merge armed for #$PR_NUMBER"
            exit 0
          fi

          echo "failed to arm auto-merge for #$PR_NUMBER" >&2
          exit 1
